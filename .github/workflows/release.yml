name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahnopoly-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # next.config.ts truncates deploymentId to 32 chars (Next's platform
      # limit), but Next also requires NEXT_DEPLOYMENT_ID to match that
      # computed deploymentId exactly wherever it's read — so the env var
      # itself has to already be pre-truncated, not the full 40-char SHA,
      # or `vercel build` fails with an E971 mismatch error.
      - run: echo "NEXT_DEPLOYMENT_ID=${GITHUB_SHA:0:32}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
